# Usable over SSH. GUI packages live in gui-optional.ini (desktop mode only).
#
# Picked at install time from one fzf tree: select a [group] line to take the
# whole group, or individual group/app lines to take just those.
#
# Entry forms are the same as required.ini. A winget entry needs a display
# name, written as `name = winget:<id>`.

[shells]
main/nu

[coreutils]
# GNU-style tools so Linux muscle memory works in pwsh and Nushell alike.
main/uutils-coreutils
main/grep
main/sed
main/gawk

[monitoring]
main/btop
main/fastfetch
main/dust
main/duf
main/gdu

[network]
main/xh
main/doggo
main/gping
main/aria2
main/rclone
main/yt-dlp

[utilities]
main/tealdeer
extras/qalculate
main/topgrade

[dev-js]
main/nodejs-lts
main/pnpm
main/bun
main/deno

[dev-go-py]
main/go
main/python
main/uv
main/pipx

[dev-lint]
main/lua
main/luarocks
main/stylua
main/luacheck
main/shellcheck
main/shfmt

[ai]
main/claude-code
main/codex
