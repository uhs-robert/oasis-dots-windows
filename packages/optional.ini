# Picked at install time from one fzf tree: select a [group] line to take the
# whole group, or individual group/app lines to take just those.
#
# Entry forms are the same as required.ini. A winget entry needs a display
# name, written as `name = winget:<id>`.

[shells]
main/nu

[coreutils]
# GNU-style tools so Linux muscle memory works in pwsh and Nushell alike.
main/uutils-coreutils
main/grep
main/sed
main/gawk

[desktop]
extras/hunt-and-peck
extras/sharex

[monitoring]
main/btop
main/fastfetch
main/dust
main/duf
main/gdu

[network]
main/xh
main/doggo
main/gping
main/aria2
main/rclone
main/yt-dlp

[utilities]
main/tealdeer
extras/qalculate
main/topgrade

[browsers]
extras/firefox
extras/qutebrowser

[comms]
extras/slack
extras/discord
extras/betterbird

[docs]
extras/sumatrapdf
extras/libreoffice

[media]
extras/mpv
extras/vlc
extras/gimp
extras/inkscape

[dev-js]
main/nodejs-lts
main/pnpm
main/bun
main/deno

[dev-go-py]
main/go
main/python
main/uv
main/pipx

[dev-lint]
main/lua
main/luarocks
main/stylua
main/luacheck
main/shellcheck
main/shfmt

[docker]
docker-desktop = winget:Docker.DockerDesktop

[ai]
main/claude-code
main/codex
