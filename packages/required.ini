# Always installed: the configs and keybinds in home/ depend on everything here.
#
# Entry forms:
#   <bucket>/<app>      Scoop app; the bucket is added on first use
#   winget:<id>         winget package
#   psgallery:<module>  PowerShell module, installed for the current user
#
# Sections are only for reading; nothing here is selectable.
# GUI packages live in gui-required.ini (desktop mode only).

[installer]
main/git
main/7zip
main/fzf
main/just

[shell]
main/pwsh
main/starship
main/zoxide
main/lsd
main/bat
main/less
main/fd
main/ripgrep
psgallery:PSReadLine
psgallery:PSFzf

[editor]
main/neovim
# nvim-treesitter compiles its parsers locally and needs both of these on Windows.
main/zig
main/tree-sitter

[git]
extras/lazygit
main/delta
main/difftastic
main/mergiraf
main/gh

[files]
main/yazi
# Yazi's previewers shell out to these.
main/ffmpeg
main/poppler
main/imagemagick
main/jq
