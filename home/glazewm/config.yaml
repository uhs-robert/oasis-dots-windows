general:
  startup_commands:
    - 'shell-exec zebar'
    - 'shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\launch.ps1 -shortcut Flow*Launcher'
    # Optional; launch.ps1 is a no-op when the shortcut does not exist.
    - 'shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\launch.ps1 -shortcut HuntAndPeck'
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

# Top outer gap is the 36px Zebar bar plus the normal gap.
gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '44px'
    right: '8px'
    bottom: '8px'
    left: '8px'

# Oasis Moonlight: active tab blue for focus, surface for the rest.
window_effects:
  focused_window:
    border:
      enabled: true
      color: '#7FA3C9'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: true
      color: '#1E2A38'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_process: { equals: 'Flow.Launcher' }
      - window_process: { equals: 'hap' }
      - window_process: { equals: 'ShareX' }
        window_title: { regex: '(?i)(region|capture|recorder|color)' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

  - commands: ['set-floating --centered']
    match:
      # #32770 is the class of standard Win32 dialogs (open/save, message boxes).
      - window_class: { equals: '#32770' }
      - window_process: { equals: 'Taskmgr' }
      - window_process: { equals: 'wezterm-gui' }
        window_title: { regex: '(?i)qalc' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['resize --width -10%']
        bindings: ['shift+h', 'shift+left']
      - commands: ['resize --width +10%']
        bindings: ['shift+l', 'shift+right']
      - commands: ['resize --height +10%']
        bindings: ['shift+k', 'shift+up']
      - commands: ['resize --height -10%']
        bindings: ['shift+j', 'shift+down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'alt+r']

  # Each key launches an app, then leaves the mode. The Zebar bar lists the keys.
  - name: 'apps'
    keybindings:
      # browser
      - commands: ['shell-exec firefox', 'wm-disable-binding-mode --name apps']
        bindings: ['b']
      - commands: ['shell-exec qutebrowser', 'wm-disable-binding-mode --name apps']
        bindings: ['q']
      # terminal apps run inside WezTerm
      - commands: ['shell-exec wezterm-gui start nvim', 'wm-disable-binding-mode --name apps']
        bindings: ['e']
      - commands: ['shell-exec wezterm-gui start yazi', 'wm-disable-binding-mode --name apps']
        bindings: ['f']
      - commands: ['shell-exec Betterbird', 'wm-disable-binding-mode --name apps']
        bindings: ['m']
      - commands: ['shell-exec slack', 'wm-disable-binding-mode --name apps']
        bindings: ['s']
      # Apps without a GUI Scoop shim start from their Start Menu shortcut
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\launch.ps1 -shortcut Discord', 'wm-disable-binding-mode --name apps']
        bindings: ['d']
      # floated by the window rule on its title
      - commands: ['shell-exec wezterm-gui start qalc', 'wm-disable-binding-mode --name apps']
        bindings: ['c']
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\launch.ps1 -shortcut GIMP', 'wm-disable-binding-mode --name apps']
        bindings: ['g']
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\launch.ps1 -shortcut Inkscape', 'wm-disable-binding-mode --name apps']
        bindings: ['i']
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\launch.ps1 -shortcut LibreOffice*Writer', 'wm-disable-binding-mode --name apps']
        bindings: ['w']
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\launch.ps1 -shortcut LibreOffice*Calc', 'wm-disable-binding-mode --name apps']
        bindings: ['x']
      - commands: ['shell-exec wezterm-gui start', 'wm-disable-binding-mode --name apps']
        bindings: ['t']
      - commands: ['shell-exec wezterm-gui start gdu', 'wm-disable-binding-mode --name apps']
        bindings: ['u']
      - commands: ['wm-disable-binding-mode --name apps']
        bindings: ['escape', 'alt+a']

  # Each key focuses the app's window, launching it when none is open.
  - name: 'go'
    keybindings:
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\focus-or-launch.ps1 -process_name wezterm-gui wezterm-gui start', 'wm-disable-binding-mode --name go']
        bindings: ['t']
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\focus-or-launch.ps1 -process_name firefox firefox', 'wm-disable-binding-mode --name go']
        bindings: ['b']
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\focus-or-launch.ps1 -process_name qutebrowser qutebrowser', 'wm-disable-binding-mode --name go']
        bindings: ['q']
      # files and config are told apart by WezTerm window title
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\focus-or-launch.ps1 -process_name wezterm-gui -title_pattern (?i)yazi wezterm-gui start yazi', 'wm-disable-binding-mode --name go']
        bindings: ['f']
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\focus-or-launch.ps1 -process_name betterbird Betterbird', 'wm-disable-binding-mode --name go']
        bindings: ['m']
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\focus-or-launch.ps1 -process_name slack slack', 'wm-disable-binding-mode --name go']
        bindings: ['s']
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\focus-or-launch.ps1 -process_name discord -shortcut Discord', 'wm-disable-binding-mode --name go']
        bindings: ['d']
      - commands: ['shell-exec --hide-window pwsh -NoProfile -ExecutionPolicy Bypass -File %DOTFILES_WINDOWS%\home\glazewm\scripts\focus-or-launch.ps1 -process_name wezterm-gui -title_pattern (?i)nvim wezterm-gui start --cwd %DOTFILES_WINDOWS% nvim .', 'wm-disable-binding-mode --name go']
        bindings: ['c']
      - commands: ['focus --recent-workspace', 'wm-disable-binding-mode --name go']
        bindings: ['tab']
      - commands: ['wm-disable-binding-mode --name go']
        bindings: ['escape', 'alt+g']

keybindings:
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']
  - commands: ['wm-enable-binding-mode --name apps']
    bindings: ['alt+a']
  - commands: ['wm-enable-binding-mode --name go']
    bindings: ['alt+g']

  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']

  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-tiling']
    bindings: ['alt+t']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['toggle-minimized']
    bindings: ['alt+m']
  - commands: ['close']
    bindings: ['alt+shift+q']

  - commands: ['wm-exit']
    bindings: ['alt+shift+e']
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']

  - commands: ['shell-exec wezterm-gui start']
    bindings: ['alt+enter']

  - commands: ['focus --next-active-workspace']
    bindings: ['alt+oem_period']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+oem_comma']
  - commands: ['focus --recent-workspace']
    bindings: ['alt+d']

  # Send the whole workspace to the monitor in that direction.
  - commands: ['move-workspace --direction left']
    bindings: ['alt+ctrl+h']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+ctrl+l']
  - commands: ['move-workspace --direction up']
    bindings: ['alt+ctrl+k']
  - commands: ['move-workspace --direction down']
    bindings: ['alt+ctrl+j']

  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
