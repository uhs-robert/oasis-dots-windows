<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link rel="stylesheet" type="text/css" href="./whichkey.css" />
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      // Pinned to the installed Zebar's minor version: `3.0` resolves to an older client that lacks
      // newer APIs such as currentWidget().tauriWindow.
      import * as zebar from 'https://esm.sh/zebar@3.3';

      // What each binding mode's keys do, kept in sync with binding_modes in
      // home/glazewm/config.yaml. A hint is [key, label, requires?]: `requires` is the package name
      // (as in packages/*.ini) whose absence from installed.json hides the hint. The help hints are
      // the top-level keybindings of the same file.
      const mode_hints = {
        resize: [
          ['h j k l', 'size 2%'],
          ['H J K L', 'size 10%'],
          ['esc enter', 'done'],
        ],
        apps: [
          ['t', 'WezTerm', 'wezterm'], ['e', 'nvim', 'neovim'], ['f', 'yazi', 'yazi'], ['u', 'gdu', 'gdu'],
          ['c', 'qalc', 'qalculate'], ['b', 'Firefox', 'firefox'], ['q', 'qutebrowser', 'qutebrowser'], ['s', 'Slack', 'slack'],
          ['d', 'Discord', 'discord'], ['m', 'Betterbird', 'betterbird'], ['g', 'GIMP', 'gimp'], ['i', 'Inkscape', 'inkscape'],
          ['w', 'Writer', 'libreoffice'], ['x', 'Calc', 'libreoffice'],
        ],
        go: [
          ['t', 'WezTerm', 'wezterm'], ['f', 'yazi', 'yazi'], ['c', 'nvim (dotfiles)', 'neovim'], ['b', 'Firefox', 'firefox'],
          ['q', 'qutebrowser', 'qutebrowser'], ['m', 'Betterbird', 'betterbird'], ['s', 'Slack', 'slack'], ['d', 'Discord', 'discord'],
          ['tab', 'last workspace'],
        ],
        help: [
          ['Alt+h j k l', 'focus (or arrows)'],
          ['Alt+Shift+h j k l', 'move window'],
          ['Alt+Ctrl+h / l', 'prev / next workspace'],
          ['Alt+Ctrl+j / k', 'window to prev / next ws'],
          ['Alt+Ctrl+Shift+h j k l', 'workspace to monitor'],
          ['Alt+1..9', 'workspace'],
          ['Alt+Shift+1..9', 'window to workspace'],
          ['Alt+. / Alt+,', 'next / prev workspace'],

          ['Alt+d', 'recent workspace'],
          ['Alt+r', 'resize mode'],
          ['Alt+a', 'apps mode'],
          ['Alt+g', 'go mode'],
          ['Alt+Shift+/', 'this help'],
          ['Alt+Enter', 'WezTerm'],

          ['Alt+o', 'Run dialog'],
          ['Alt+x / Alt+Shift+q', 'close'],
          ['Alt+f', 'fullscreen'],
          ['Alt+t', 'tiling'],
          ['Alt+Shift+Space', 'floating'],
          ['Alt+m', 'minimize'],

          ['Alt+v', 'tiling direction'],
          ['Alt+Shift+p', 'pause GlazeWM'],
          ['Alt+Shift+r', 'reload config'],
          ['Alt+Shift+w', 'redraw'],
          ['Alt+Shift+e', 'exit GlazeWM'],
        ],
      };

      const column_count = 4;

      // The installer lists the installed packages in installed.json. Zebar may cache widget files,
      // hence the no-store and the unique query. Any failure shows every hint rather than none.
      async function read_installed_names() {
        try {
          const response = await fetch(`./installed.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) return null;
          const names = await response.json();
          return Array.isArray(names) ? new Set(names) : null;
        } catch {
          return null;
        }
      }
      const installed_names = await read_installed_names();

      const root = document.getElementById('root');

      // There is no devtools window for widgets, so failures are drawn where the popup would be.
      function show_error(message) {
        const container = el('div', 'panel', '');
        container.append(el('div', 'panel_title', 'which-key error'), el('div', 'entry_label', message));
        root.replaceChildren(container);
      }
      window.addEventListener('error', event => show_error(String(event.message)));
      window.addEventListener('unhandledrejection', event => show_error(String(event.reason)));

      const widget_window = zebar.currentWidget().tauriWindow;

      // The window stays up and click-through, and is simply empty outside a mode.
      // Hiding and showing it instead would risk show() taking focus, and resize
      // mode acts on the focused window.
      widget_window?.setIgnoreCursorEvents(true).catch(error => show_error(`click-through: ${error}`));

      function el(tag, class_name, text) {
        const node = document.createElement(tag);
        node.className = class_name;
        node.textContent = text;
        return node;
      }

      function panel(binding_mode, hints) {
        const entries = el('div', 'entries', '');
        entries.style.gridTemplateRows = `repeat(${Math.ceil(hints.length / column_count)}, auto)`;
        for (const [key, label] of hints) {
          const entry = el('div', 'entry', '');
          entry.append(el('span', 'entry_key', key), el('span', 'entry_label', label));
          entries.append(entry);
        }
        const container = el('div', 'panel', '');
        container.append(
          el('div', 'panel_title', binding_mode.displayName ?? binding_mode.name),
          entries,
        );
        return container;
      }

      const glazewm = zebar.createProvider({ type: 'glazewm' });

      // glazewm emits on every window event; rebuilding the panel for an unchanged mode would repaint
      // a software-rendered window for nothing.
      let shown_mode_key = null;

      function update(output) {
        const binding_mode = output?.bindingModes?.[0];
        const mode_hint_list = binding_mode && mode_hints[binding_mode.name];
        const hints = mode_hint_list?.filter(([, , requires]) => !requires || !installed_names || installed_names.has(requires));
        const mode_key = hints ? `${binding_mode.name}|${binding_mode.displayName ?? ''}` : '';
        if (mode_key === shown_mode_key) return;
        shown_mode_key = mode_key;
        if (hints) {
          root.replaceChildren(panel(binding_mode, hints));
        } else {
          root.replaceChildren();
        }
      }

      glazewm.onOutput(update);
      glazewm.onError(error => show_error(`glazewm provider: ${error}`));
    </script>
  </body>
</html>
