<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        memory: { type: 'memory' },
        network: { type: 'network' },
        systray: { type: 'systray' },
        date: { type: 'date', formatting: 'EEE d MMM  HH:mm' },
      });

      const root = document.getElementById('root');

      // Nerd Font codepoints (JetBrainsMono Nerd Font).
      const icons = {
        logo: '',
        cpu: '',
        memory: '',
        wifi: '',
        ethernet: '\u{f0200}',
        offline: '\u{f05aa}',
        clock: '',
      };

      // Runs the exe directly: going through launch.ps1 cost a cold pwsh start plus a Start Menu search.
      const flow_launcher_command =
        'shell-exec %SCOOP%\\apps\\flow-launcher\\current\\Flow.Launcher.exe';

      function el(tag, class_name, text, attributes) {
        const node = document.createElement(tag);
        if (class_name) node.className = class_name;
        if (text !== undefined && text !== null) node.textContent = text;
        for (const [name, value] of Object.entries(attributes ?? {})) {
          node.setAttribute(name, value);
        }
        return node;
      }

      function stat(class_name, icon, text, extra_class) {
        const node = el('div', class_name);
        node.append(el('span', 'stat_icon', icon), el('span', extra_class, text));
        return node;
      }

      function workspaces_section(glazewm) {
        const container = el('div', 'workspaces');
        for (const workspace of glazewm.currentWorkspaces) {
          const classes = ['workspace'];
          if (workspace.hasFocus) classes.push('focused');
          if (workspace.isDisplayed) classes.push('displayed');
          container.append(
            el('button', classes.join(' '), workspace.displayName ?? workspace.name, {
              'data-command': `focus --workspace ${workspace.name}`,
            }),
          );
        }
        return container;
      }

      // The bar re-renders on every CPU/memory tick, but the tray rarely changes. Its node is kept
      // and re-attached, and only rebuilt when the icon list changes, since software-rendered
      // WebView2 makes redundant image decodes costly.
      const tray = el('div', 'tray');
      let tray_signature = null;

      function tray_section(systray) {
        const icons_now = systray.icons ?? [];
        const signature = icons_now.map(i => `${i.id}|${i.iconHash}|${i.tooltip}`).join('\n');
        if (signature !== tray_signature) {
          tray_signature = signature;
          tray.replaceChildren(
            ...icons_now.map(icon => {
              const node = el('img', 'tray_icon', null, {
                src: icon.iconUrl,
                title: icon.tooltip,
                alt: '',
                'data-tray-id': icon.id,
              });
              node.draggable = false;
              return node;
            }),
          );
        }
        return tray;
      }

      function mode_section(binding_mode) {
        return el('span', 'mode_name', binding_mode.displayName ?? binding_mode.name);
      }

      function network_icon(network) {
        switch (network.defaultInterface?.type) {
          case 'ethernet':
            return icons.ethernet;
          case 'wifi':
            return icons.wifi;
          default:
            return icons.offline;
        }
      }

      function render(output) {
        const { glazewm, cpu, memory, network, systray, date } = output;
        const app = el('div', 'app');

        const left = el('div', 'left');
        // Flow Launcher is single-instance, so relaunching it shows its search box.
        left.append(
          glazewm
            ? el('button', 'logo', icons.logo, { 'data-command': flow_launcher_command })
            : el('span', 'logo', icons.logo),
        );
        if (glazewm) left.append(workspaces_section(glazewm));

        const center = el('div', 'center');
        const active_mode = glazewm?.bindingModes?.[0];
        if (active_mode) {
          center.append(mode_section(active_mode));
        } else {
          center.append(el('div', 'title', glazewm?.focusedContainer?.title ?? ''));
        }

        const right = el('div', 'right');
        if (glazewm?.isPaused) {
          right.append(el('button', 'paused', 'PAUSED', { 'data-command': 'wm-toggle-pause' }));
        }
        if (network) {
          right.append(stat('network', network_icon(network), network.defaultGateway?.ssid ?? ''));
        }
        if (memory) {
          right.append(stat('memory', icons.memory, `${Math.round(memory.usage)}%`));
        }
        if (cpu) {
          right.append(
            stat('cpu', icons.cpu, `${Math.round(cpu.usage)}%`, cpu.usage > 85 ? 'high_usage' : ''),
          );
        }
        if (systray?.icons?.length) right.append(tray_section(systray));
        if (date) right.append(stat('clock', icons.clock, date.formatted));

        app.append(left, center, right);
        root.replaceChildren(app);
      }

      // The bar is rebuilt on every provider update, so a click could land on a
      // node that was just replaced; pointerdown fires before that can happen.
      root.addEventListener('pointerdown', event => {
        const command = event.target.closest('[data-command]')?.dataset.command;
        if (command) providers.outputMap.glazewm?.runCommand(command);
      });

      // Mouse buttons: 0 left, 2 right. Other buttons are ignored.
      root.addEventListener('pointerdown', event => {
        const icon_id = event.target.closest('[data-tray-id]')?.dataset.trayId;
        const systray = providers.outputMap.systray;
        if (!icon_id || !systray) return;
        if (event.button === 0) systray.onLeftClick(icon_id);
        else if (event.button === 2) systray.onRightClick(icon_id);
      });
      root.addEventListener('contextmenu', event => event.preventDefault());

      providers.onOutput(() => render(providers.outputMap));
      render(providers.outputMap);
    </script>
  </body>
</html>
