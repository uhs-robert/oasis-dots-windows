<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import * as zebar from 'https://esm.sh/zebar@3.0';

      // Windows Server in the client's remote sessions has no GPU: WebView2 renders in software and
      // the remote tool re-encodes every changed pixel, so DWM load follows how often the bar
      // changes. Zebar's own refresh intervals (cpu, memory, network 5 s; date 1 s) are too chatty
      // there.
      const server_refresh_ms = 10_000;
      // The clock shows no seconds; this only bounds how stale the minute can get.
      const server_date_refresh_ms = 15_000;
      const host_timeout_ms = 3_000;

      // Resolves to the host output, or null if it does not arrive in time, which keeps Zebar's defaults.
      function first_host_output() {
        const host = zebar.createProvider({ type: 'host' });
        return new Promise(resolve => {
          const timer = setTimeout(() => resolve(null), host_timeout_ms);
          const done = output => {
            clearTimeout(timer);
            resolve(output);
          };
          // The output may have landed before a listener could be attached.
          if (host.output) done(host.output);
          else host.onOutput(done);
        }).finally(() => host.stop());
      }

      function is_windows_server(host) {
        return [host?.osName, host?.friendlyOsVersion].some(name => /server/i.test(name ?? ''));
      }

      const refresh_options = is_windows_server(await first_host_output())
        ? { stat: { refreshInterval: server_refresh_ms }, date: { refreshInterval: server_date_refresh_ms } }
        : { stat: {}, date: {} };

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu', ...refresh_options.stat },
        memory: { type: 'memory', ...refresh_options.stat },
        network: { type: 'network', ...refresh_options.stat },
        systray: { type: 'systray' },
        date: { type: 'date', formatting: 'EEE d MMM  HH:mm', ...refresh_options.date },
      });

      const root = document.getElementById('root');

      // Nerd Font codepoints (JetBrainsMono Nerd Font), escaped so editors and tools can't drop them.
      const icons = {
        logo: '\uf17a',
        cpu: '\uf4bc',
        memory: '\uf2db',
        wifi: '\uf1eb',
        ethernet: '\u{f0200}',
        offline: '\u{f05aa}',
        clock: '\uf017',
        tray_collapsed: '\uf053',
        tray_expanded: '\uf054',
      };

      // Runs the exe directly: going through launch.ps1 cost a cold pwsh start plus a Start Menu search.
      const flow_launcher_command =
        'shell-exec %SCOOP%\\apps\\flow-launcher\\current\\Flow.Launcher.exe';

      function el(tag, class_name, text, attributes) {
        const node = document.createElement(tag);
        if (class_name) node.className = class_name;
        if (text !== undefined && text !== null) node.textContent = text;
        for (const [name, value] of Object.entries(attributes ?? {})) {
          node.setAttribute(name, value);
        }
        return node;
      }

      // The setters below write only on change: every DOM write can repaint, and each repaint is
      // software-rendered and re-sent over the remote session.
      function set_text(node, text) {
        if (node.textContent !== text) node.textContent = text;
      }

      function set_visible(node, visible) {
        if (node.hidden === visible) node.hidden = !visible;
      }

      function stat(class_name, icon, extra_class) {
        const icon_node = el('span', 'stat_icon', icon);
        const text_node = el('span', extra_class);
        const node = el('div', class_name);
        node.append(icon_node, text_node);
        return { node, icon_node, text_node };
      }

      // The bar's DOM is built once; render() only patches the parts whose values changed.
      // Flow Launcher is single-instance, so relaunching it shows its search box.
      const logo_button = el('button', 'logo', icons.logo, { 'data-command': flow_launcher_command });
      // Without glazewm the logo is inert, so it is not a button.
      const logo_plain = el('span', 'logo', icons.logo);
      const workspaces = el('div', 'workspaces');
      const left = el('div', 'left');
      left.append(logo_button, logo_plain, workspaces);

      const mode_name = el('span', 'mode_name');
      const title = el('div', 'title');
      const center = el('div', 'center');
      center.append(mode_name, title);

      const paused = el('button', 'paused', 'PAUSED', { 'data-command': 'wm-toggle-pause' });
      const network_stat = stat('network', icons.offline);
      const memory_stat = stat('memory', icons.memory);
      const cpu_stat = stat('cpu', icons.cpu);
      const clock_stat = stat('clock', icons.clock);

      // The tray is rebuilt only when the icon list changes, since software-rendered WebView2
      // makes redundant image decodes costly.
      const tray = el('div', 'tray');
      let tray_signature = null;

      // Collapsed by default, like the Windows tray's overflow; the chevron expands it.
      let is_tray_expanded = false;
      const tray_toggle = el('button', 'tray_toggle', icons.tray_collapsed, { title: 'Show tray icons' });
      const tray_group = el('div', 'tray_group');
      tray_group.append(tray_toggle, tray);
      tray.hidden = true;

      tray_toggle.addEventListener('click', () => {
        is_tray_expanded = !is_tray_expanded;
        set_visible(tray, is_tray_expanded);
        set_text(tray_toggle, is_tray_expanded ? icons.tray_expanded : icons.tray_collapsed);
        tray_toggle.title = is_tray_expanded ? 'Hide tray icons' : 'Show tray icons';
      });

      const right = el('div', 'right');
      right.append(paused, network_stat.node, memory_stat.node, cpu_stat.node, tray_group, clock_stat.node);

      const app = el('div', 'app');
      app.append(left, center, right);
      root.replaceChildren(app);

      let workspaces_signature = null;

      // GlazeWM only reports workspaces that have been opened, and keep_alive only stops them
      // from closing, so 1-5 are drawn even before they exist; focusing one creates it.
      const pinned_workspace_names = ['1', '2', '3', '4', '5'];

      function update_workspaces(current_workspaces) {
        const active_by_name = new Map(current_workspaces.map(w => [w.name, w]));
        const extra_names = current_workspaces
          .map(w => w.name)
          .filter(name => !pinned_workspace_names.includes(name));
        const shown_names = [...pinned_workspace_names, ...extra_names];

        const signature = shown_names
          .map(name => {
            const w = active_by_name.get(name);
            return w ? `${name}|${w.displayName ?? ''}|${w.hasFocus}|${w.isDisplayed}` : `${name}|empty`;
          })
          .join('\n');
        if (signature === workspaces_signature) return;
        workspaces_signature = signature;
        workspaces.replaceChildren(
          ...shown_names.map(name => {
            const workspace = active_by_name.get(name);
            const classes = ['workspace'];
            if (!workspace) classes.push('empty');
            if (workspace?.hasFocus) classes.push('focused');
            if (workspace?.isDisplayed) classes.push('displayed');
            return el('button', classes.join(' '), workspace?.displayName ?? name, {
              'data-command': `focus --workspace ${name}`,
            });
          }),
        );
      }

      function update_tray(icons_now) {
        const signature = icons_now.map(i => `${i.id}|${i.iconHash}|${i.tooltip}`).join('\n');
        if (signature === tray_signature) return;
        tray_signature = signature;
        tray.replaceChildren(
          ...icons_now.map(icon => {
            const node = el('img', 'tray_icon', null, {
              src: icon.iconUrl,
              title: icon.tooltip,
              alt: '',
              'data-tray-id': icon.id,
            });
            node.draggable = false;
            return node;
          }),
        );
      }

      function network_icon(network) {
        switch (network.defaultInterface?.type) {
          case 'ethernet':
            return icons.ethernet;
          case 'wifi':
            return icons.wifi;
          default:
            return icons.offline;
        }
      }

      function render(output) {
        const { glazewm, cpu, memory, network, systray, date } = output;

        set_visible(logo_button, Boolean(glazewm));
        set_visible(logo_plain, !glazewm);
        set_visible(workspaces, Boolean(glazewm));
        if (glazewm) update_workspaces(glazewm.currentWorkspaces);

        const active_mode = glazewm?.bindingModes?.[0];
        set_visible(mode_name, Boolean(active_mode));
        set_visible(title, !active_mode);
        if (active_mode) set_text(mode_name, active_mode.displayName ?? active_mode.name);
        else set_text(title, glazewm?.focusedContainer?.title ?? '');

        set_visible(paused, Boolean(glazewm?.isPaused));

        set_visible(network_stat.node, Boolean(network));
        if (network) {
          set_text(network_stat.icon_node, network_icon(network));
          set_text(network_stat.text_node, network.defaultGateway?.ssid ?? '');
        }

        set_visible(memory_stat.node, Boolean(memory));
        if (memory) set_text(memory_stat.text_node, `${Math.round(memory.usage)}%`);

        set_visible(cpu_stat.node, Boolean(cpu));
        if (cpu) {
          set_text(cpu_stat.text_node, `${Math.round(cpu.usage)}%`);
          cpu_stat.text_node.classList.toggle('high_usage', cpu.usage > 85);
        }

        const tray_icons = systray?.icons ?? [];
        set_visible(tray_group, tray_icons.length > 0);
        if (tray_icons.length) update_tray(tray_icons);

        set_visible(clock_stat.node, Boolean(date));
        if (date) set_text(clock_stat.text_node, date.formatted);
      }

      // Workspace buttons are replaced when workspaces change, so a click could land on a
      // node that was just replaced; pointerdown fires before that can happen.
      root.addEventListener('pointerdown', event => {
        const command = event.target.closest('[data-command]')?.dataset.command;
        if (command) providers.outputMap.glazewm?.runCommand(command);
      });

      // Mouse buttons: 0 left, 2 right. Other buttons are ignored.
      root.addEventListener('pointerdown', event => {
        const icon_id = event.target.closest('[data-tray-id]')?.dataset.trayId;
        const systray = providers.outputMap.systray;
        if (!icon_id || !systray) return;
        if (event.button === 0) systray.onLeftClick(icon_id);
        else if (event.button === 2) systray.onRightClick(icon_id);
      });
      root.addEventListener('contextmenu', event => event.preventDefault());

      providers.onOutput(() => render(providers.outputMap));
      render(providers.outputMap);
    </script>
  </body>
</html>
